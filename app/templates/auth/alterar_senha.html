{% extends "base.html" %}

{% block title %}Alterar senha{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h2 class="mb-4"><i class="bi bi-key"></i> Alterar senha</h2>
            <div class="card">
                <div class="card-body">
                    <form method="POST" autocomplete="off">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="senha_atual" class="form-label">Senha atual</label>
                            <input type="password" class="form-control" id="senha_atual" name="senha_atual"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="nova_senha" class="form-label">Nova senha</label>
                            <input type="password" class="form-control" id="nova_senha" name="nova_senha"
                                   autocomplete="new-password" minlength="8" maxlength="128" required>
                            <div class="form-text">Mínimo de 8 caracteres, com letras maiúsculas, minúsculas e números.</div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmar_senha" class="form-label">Confirmar nova senha</label>
                            <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha"
                                   autocomplete="new-password" minlength="8" maxlength="128" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Salvar nova senha</button>
                            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
